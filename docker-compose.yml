services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainreaction
      POSTGRES_PASSWORD: chainreaction
      POSTGRES_DB: chainreaction
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainreaction -d chainreaction"]
      interval: 5s
      timeout: 3s
      retries: 10
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/chainreaction-dev
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    command: ["/chainreaction-api"]
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
  worker:
    build: ./backend
    command: ["/chainreaction-worker"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [api]
